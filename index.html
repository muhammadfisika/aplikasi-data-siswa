<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Aplikasi Data Siswa</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1565c0">


</head>

<body>

  <header class="header">
    <div class="container">

      <h1>Data Siswa</h1>

      <p>
        Aplikasi Data Siswa
      </p>

    </div>
  </header>


  <main class="container">

    <!-- FORM DATA SISWA -->
    <section class="card">

      <h2>Tambah Data Siswa</h2>

      <form id="formSiswa">

        <div class="form-group">

          <label for="nisn">
            NISN
          </label>

          <input
            type="text"
            id="nisn"
            placeholder="Masukkan NISN"
            required
          >

        </div>


        <div class="form-group">

          <label for="nama">
            Nama Siswa
          </label>

          <input
            type="text"
            id="nama"
            placeholder="Masukkan nama siswa"
            required
          >

        </div>


        <div class="form-group">

          <label for="kelas">
            Kelas
          </label>

          <select id="kelas" required>

            <option value="">
              -- Pilih Kelas --
            </option>

            <option value="X-1">X-1</option>
            <option value="X-2">X-2</option>
            <option value="X-3">X-3</option>

            <option value="XI-1">XI-1</option>
            <option value="XI-2">XI-2</option>
            <option value="XI-3">XI-3</option>

            <option value="XII-1">XII-1</option>
            <option value="XII-2">XII-2</option>
            <option value="XII-3">XII-3</option>

          </select>

        </div>


        <button
          type="submit"
          class="btn-primary"
        >
          Simpan Data
        </button>

      </form>

    </section>


    <!-- DAFTAR SISWA -->
    <section class="card">

      <h2>Daftar Siswa</h2>

      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="Cari nama siswa..."
        >

      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>No</th>
              <th>NISN</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Aksi</th>

            </tr>

          </thead>

          <tbody id="tabelSiswa">

            <tr>

              <td colspan="5" class="empty">

                Belum ada data siswa.

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <footer>

    <p>
      Aplikasi Data Siswa
    </p>

  </footer>




</body>
</html>
